[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragval"
version = "0.0.1"
description = "The complete RAG evaluation library. Scores, diagnoses, and domain-aware."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Shivam Raghav" }]
keywords = [
    "rag",
    "llm",
    "evaluation",
    "nlp",
    "retrieval",
    "augmented",
    "generation",
    "hallucination",
    "faithfulness",
    "diagnosis",
    "clinical",
    "legal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "litellm>=1.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
pandas = ["pandas>=2.0.0"]
all = ["pandas>=2.0.0"]

[project.scripts]
ragval = "ragval.cli:app"

[project.urls]
Homepage = "https://github.com/shivamraghav779/ragval"
Documentation = "https://github.com/shivamraghav779/ragval#readme"
Issues = "https://github.com/shivamraghav779/ragval/issues"

[tool.hatch.build.targets.wheel]
packages = ["ragval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
